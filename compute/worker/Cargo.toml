[package]
name = "compute-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
compute-types.workspace = true
compute-imageops.workspace = true
compute-optimize.workspace = true
anyhow.workspace = true
tokio.workspace = true
redis.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
config.workspace = true
validator.workspace = true
dotenvy = "0.15.7"
aws-sdk-s3 = { workspace = true, features = ["rustls"] }
rustls.workspace = true
tempfile.workspace = true
libc = "0.2"
bytes = "1"
url = "2"
# Fetches URL sources. Without default features there are no cookies and no
# transparent decompression; `fetch.rs` also turns off proxies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
