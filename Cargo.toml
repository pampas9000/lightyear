[workspace]
members = [
    "compute/crates/types",
    "compute/crates/imageops",
    "compute/worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
compute-types = { path = "compute/crates/types" }
compute-imageops = { path = "compute/crates/imageops" }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
redis = { version = "1.2", features = ["tokio-comp", "tokio-rustls-comp"] }
uuid = { version = "1.23", features = ["v4","v7", "serde"] }
config = "0.15"
validator = { version = "0.20", features = ["derive"] }
serde_json = "1.0"
aws-sdk-s3 = { version = "1.1", features = ["rustls"] }
tempfile = "3"
rustls = { version = "0.23", features = ["ring"] }
